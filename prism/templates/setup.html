{% extends "base.html" %}
{% block title %}{{ t('title_setup') }}{% endblock %}
{% block content %}
<div class="mb-8 max-w-2xl">
  <h1 class="text-2xl font-semibold tracking-tight">{{ t('setup_title') }}</h1>
  <p class="mt-1 text-sm text-slate-500">{{ t('setup_desc') }}</p>
</div>

<form method="post" action="/setup" id="setup-form" class="max-w-2xl space-y-5 rounded-xl border border-slate-200 bg-white p-6">
  <div>
    <label class="mb-1 block text-sm font-medium">{{ t('setup_brand_label') }}</label>
    <input name="name" required value="{{ own.name if own else '' }}" placeholder="{{ t('new_client_placeholder') }}"
           class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm focus:border-indigo-400 focus:outline-none">
  </div>
  <div>
    <label class="mb-1 block text-sm font-medium">{{ t('setup_website_label') }} <span class="font-normal text-slate-400">({{ t('setup_website_hint') }})</span></label>
    <div class="flex gap-2">
      <input name="website" id="setup-website" value="{{ own.website if own else '' }}" placeholder="https://www.allbirds.com"
             class="flex-1 rounded-lg border border-slate-200 px-3 py-2 text-sm focus:border-indigo-400 focus:outline-none">
      <button type="button" id="discover-btn"
              class="rounded-lg border border-indigo-200 bg-indigo-50 px-4 py-2 text-sm font-medium text-indigo-600 hover:bg-indigo-100 transition-colors disabled:opacity-50">
        {{ t('discover_competitors') }}
      </button>
    </div>
    <div id="discover-status" class="mt-2 hidden text-xs text-slate-500"></div>
  </div>
  <div>
    <label class="mb-1 block text-sm font-medium">{{ t('setup_competitors_label') }} <span class="font-normal text-slate-400">({{ t('setup_competitors_hint') }})</span></label>
    <textarea name="competitors" id="setup-competitors" rows="3" placeholder="Nike, Adidas, Allbirds"
           class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm focus:border-indigo-400 focus:outline-none">{{ competitors | join(', ') }}</textarea>
  </div>
  <label class="flex items-start gap-3 rounded-lg bg-slate-50 p-4">
    <input type="checkbox" name="generate" value="1" checked class="mt-0.5">
    <span class="text-sm">
      <span class="font-medium">{{ t('generate_starter') }}</span><br>
      <span class="text-slate-500">{{ t('generate_starter_desc') }}</span>
    </span>
  </label>
  <div class="flex items-center gap-3 pt-1">
    <button id="submit-btn" class="rounded-lg bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-indigo-700">
      {{ t('update_workspace') if own else t('create_workspace') }}
    </button>
    {% if not PRISM_KEY %}<span class="text-xs text-amber-600">{{ t('no_llm_key') }}</span>{% endif %}
  </div>
</form>

{# loading overlay #}
<div id="loading-overlay" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/60 backdrop-blur-sm">
  <div class="rounded-xl bg-white px-8 py-6 text-center shadow-2xl">
    <svg class="mx-auto mb-3 h-8 w-8 animate-spin text-indigo-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
    </svg>
    <p class="text-sm font-medium text-slate-700">{{ t('saving') }}…</p>
    <p class="mt-1 text-xs text-slate-400">{{ t('saving_setup_hint') }}</p>
  </div>
</div>

<script>
const discoverBtn = document.getElementById('discover-btn');
const discoverStatus = document.getElementById('discover-status');
const websiteInput = document.getElementById('setup-website');
const competitorsTextarea = document.getElementById('setup-competitors');
const nameInput = document.querySelector('input[name="name"]');

discoverBtn.addEventListener('click', async function() {
  const website = websiteInput.value.trim();
  if (!website) {
    discoverStatus.classList.remove('hidden');
    discoverStatus.textContent = 'Please enter a website URL first.';
    discoverStatus.className = 'mt-2 text-xs text-amber-600';
    return;
  }

  discoverBtn.disabled = true;
  discoverStatus.classList.remove('hidden');
  discoverStatus.textContent = 'Crawling website pages…';
  discoverStatus.className = 'mt-2 text-xs text-slate-500';

  try {
    const resp = await fetch('/api/setup/discover-competitors', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        domain: website,
        brand_name: nameInput.value.trim()
      })
    });
    const data = await resp.json();

    if (data.error && !data.competitors.length) {
      discoverStatus.textContent = data.error;
      discoverStatus.className = 'mt-2 text-xs text-amber-600';
      return;
    }

    if (data.competitors.length) {
      competitorsTextarea.value = data.competitors.join(', ');
    }

    let msg = `Found ${data.competitors.length} competitors`;
    if (data.business) msg += ` — ${data.business.slice(0, 80)}…`;
    if (data.pages_analyzed) msg += ` (${data.pages_analyzed} pages analyzed)`;
    discoverStatus.textContent = msg;
    discoverStatus.className = 'mt-2 text-xs text-emerald-600';

    if (data.error) {
      discoverStatus.textContent += ' ⚠ ' + data.error;
      discoverStatus.className = 'mt-2 text-xs text-amber-600';
    }
  } catch (err) {
    discoverStatus.textContent = 'Network error — please try again.';
    discoverStatus.className = 'mt-2 text-xs text-red-500';
  } finally {
    discoverBtn.disabled = false;
  }
});

document.getElementById('setup-form').addEventListener('submit', function() {
  const overlay = document.getElementById('loading-overlay');
  overlay.classList.remove('hidden');
  overlay.classList.add('flex');
  document.getElementById('submit-btn').disabled = true;
});
</script>
{% endblock %}
