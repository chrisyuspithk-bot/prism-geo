app = "prism-geo"
primary_region = "iad"

[mounts]
  source = "prism_data"
  destination = "/data"

[env]
  PRISM_DB_PATH = "/data/prism.db"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "get"
    path = "/"
